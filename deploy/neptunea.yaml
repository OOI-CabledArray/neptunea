AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Neptunea: one EC2 server running the Panel app behind Caddy (HTTPS via
  Let's Encrypt) at a Route 53 name, and a weekday start/stop schedule.
  See deploy/README.md.

Parameters:
  DomainName:
    Type: String
    Default: neptunea.ooi-rca.net
  HostedZoneName:
    Type: String
    Default: ooi-rca.net.
    Description: Existing Route 53 zone for DomainName (trailing dot).
  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: >-
      Who can reach ports 80/443. Let's Encrypt must reach port 80 to issue
      and renew the certificate, so restricting this breaks HTTPS unless the
      certificate setup changes (see deploy/README.md).
    AllowedPattern: '^\d{1,3}(\.\d{1,3}){3}/\d{1,2}$'
  InstanceType:
    Type: String
    Default: r7g.large
    Description: >-
      r7g.large = 2 vCPU / 16 GB (ARM). Memory matters most: curated
      variables and stream overviews are cached in RAM. Switching to an Intel
      type (e.g. r7i.large) requires the x86_64 AmiParameter.
  AmiParameter:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Latest Amazon Linux 2023 image, looked up at deploy time.
  RepoUrl:
    Type: String
    Default: https://github.com/OOI-CabledArray/neptunea.git
  Branch:
    Type: String
    Default: main
  StartCron:
    Type: String
    Default: cron(0 7 ? * MON-FRI *)
    Description: When to start the server (EventBridge Scheduler cron).
  StopCron:
    Type: String
    Default: cron(0 19 ? * MON-FRI *)
    Description: When to stop the server (EventBridge Scheduler cron).
  ScheduleTimezone:
    Type: String
    Default: America/Los_Angeles
  ScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: DISABLED leaves the server in whatever state it is in (e.g. running 24/7).

Resources:
  # --- Network access: HTTP/HTTPS from AllowedCidr; admin via Session Manager (no SSH)
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Neptunea web access
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref AllowedCidr}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: !Ref AllowedCidr}

  # Fixed address so the URL survives stop/start
  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags: [{Key: Name, Value: neptunea}]

  EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIP.AllocationId
      InstanceId: !Ref Instance

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: !Ref HostedZoneName
      Name: !Ref DomainName
      Type: A
      TTL: "300"
      ResourceRecords: [!Ref ElasticIP]

  # --- Server permissions: Session Manager, read /neptunea/* settings, read data buckets
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: neptunea
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParametersByPath]
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/neptunea
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/neptunea/*
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::ooi-data
                  - !Sub arn:${AWS::Partition}:s3:::ooi-data/*
                  - !Sub arn:${AWS::Partition}:s3:::rca-advanced-qaqc
                  - !Sub arn:${AWS::Partition}:s3:::rca-advanced-qaqc/*

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # --- The server. First boot installs git, uv, Caddy and two systemd services.
  # Caddy terminates HTTPS for DomainName and proxies to the app on localhost:5006;
  # every app start pulls the branch, syncs the locked env, and serves.
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiParameter
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt SecurityGroup.GroupId]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 30, VolumeType: gp3, Encrypted: true}
      Tags: [{Key: Name, Value: neptunea}]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y git tar
          curl -LsSf https://astral.sh/uv/0.9.7/install.sh | env UV_INSTALL_DIR=/usr/local/bin UV_NO_MODIFY_PATH=1 sh
          useradd --system --create-home --home-dir /opt/neptunea neptunea

          # Caddy: HTTPS via Let's Encrypt in front of the app (same setup as qaqc.ooi-rca.net)
          # pinned release, verified against its published SHA-512 (update version + sums together)
          CADDY=caddy_2.11.7_linux_$(uname -m | sed 's/aarch64/arm64/; s/x86_64/amd64/').tar.gz
          curl -LsSfo /tmp/$CADDY https://github.com/caddyserver/caddy/releases/download/v2.11.7/$CADDY
          grep " $CADDY$" > /tmp/caddy.sha512 <<'EOF'
          3db36ba90c7a6e8dda40ee3dd71fa08844c76b5fb08f61b31e5e78d2ed38e71c51dc7baed875e50d1ca1279196e84302967237386ae87c91ae9f2aaceada682e  caddy_2.11.7_linux_arm64.tar.gz
          a7a433a1b133efc3c8d10eb0b99d52a24b5ef5c322dc77f5282182b1c0402139ab83f3a99f0c52409df77d20123fb0b523edad8a66d8f5e49136197bf61ef0e7  caddy_2.11.7_linux_amd64.tar.gz
          EOF
          (cd /tmp && sha512sum -c caddy.sha512)
          tar -xzf /tmp/$CADDY -C /usr/local/bin caddy
          useradd --system --create-home --home-dir /var/lib/caddy caddy
          mkdir -p /etc/caddy
          cat > /etc/caddy/Caddyfile <<'EOF'
          ${DomainName} {
              redir / /neptunea
              reverse_proxy localhost:5006
          }
          EOF
          cat > /etc/systemd/system/caddy.service <<'EOF'
          [Unit]
          Description=Caddy
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=notify
          User=caddy
          ExecStart=/usr/local/bin/caddy run --environ --config /etc/caddy/Caddyfile
          ExecReload=/usr/local/bin/caddy reload --config /etc/caddy/Caddyfile --force
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
          EOF

          cat > /usr/local/bin/neptunea-start <<'EOF'
          #!/bin/bash
          # Runs on every service start: update code, sync env, launch.
          set -eo pipefail
          cd /opt/neptunea
          # private repo: read-only GitHub token from Parameter Store, if present
          TOKEN=$(aws ssm get-parameter --name /neptunea/github-token --with-decryption \
                    --query Parameter.Value --output text 2>/dev/null || true)
          if [ -n "$TOKEN" ]; then
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader
            export GIT_CONFIG_VALUE_0="Authorization: Basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          fi
          if [ -d app/.git ]; then
            git -C app pull --ff-only || echo "git pull failed; running existing checkout"
          else
            git clone --branch "$BRANCH" "$REPO" app
          fi
          cd app
          uv sync --locked
          # app settings (OOI_USERNAME, OOI_TOKEN, ...) from /neptunea/env/<NAME>
          while read -r name value; do
            if [ -n "$name" ]; then export "$(basename "$name")=$value"; fi
          done < <(aws ssm get-parameters-by-path --path /neptunea/env/ --with-decryption \
                     --query 'Parameters[].[Name,Value]' --output text)
          exec .venv/bin/panel serve rca_panel_app/neptunea.py \
            --address 127.0.0.1 --port 5006 --use-xheaders --allow-websocket-origin "$ORIGIN"
          EOF
          chmod 755 /usr/local/bin/neptunea-start

          cat > /etc/systemd/system/neptunea.service <<'EOF'
          [Unit]
          Description=Neptunea
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=neptunea
          Environment=REPO=${RepoUrl} BRANCH=${Branch} ORIGIN=${DomainName} AWS_DEFAULT_REGION=${AWS::Region}
          Environment=PATH=/usr/local/bin:/usr/bin:/bin
          ExecStart=/usr/local/bin/neptunea-start
          Restart=on-failure
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
          EOF
          systemctl daemon-reload
          systemctl enable --now neptunea caddy

  # --- Weekday schedule
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-stop
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ec2:StartInstances, ec2:StopInstances]
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}

  StartSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Start Neptunea
      ScheduleExpression: !Ref StartCron
      ScheduleExpressionTimezone: !Ref ScheduleTimezone
      State: !Ref ScheduleState
      FlexibleTimeWindow: {Mode: "OFF"}
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:startInstances
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"InstanceIds": ["${Instance}"]}'

  StopSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Stop Neptunea
      ScheduleExpression: !Ref StopCron
      ScheduleExpressionTimezone: !Ref ScheduleTimezone
      State: !Ref ScheduleState
      FlexibleTimeWindow: {Mode: "OFF"}
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:stopInstances
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"InstanceIds": ["${Instance}"]}'

Outputs:
  Url:
    Description: Share this with coworkers
    Value: !Sub https://${DomainName}
  InstanceId:
    Value: !Ref Instance

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "neptunea"
version = "0.1.0"
description = "Neptunea: interactive Panel app for verifying OOI Regional Cabled Array data products"
requires-python = ">=3.10"
dependencies = [
    "panel",
    "hvplot",
    "holoviews",
    "datashader",
    "dask[dataframe]",
    "bokeh",
    "xarray",
    "zarr",
    "numpy",
    "pandas",
    "s3fs",
    "cmocean",
    "requests",
    "python-dotenv",
    "click",
]

[project.scripts]
neptunea = "rca_panel_app.serve:main"

[tool.setuptools]
packages = ["rca_panel_app"]
